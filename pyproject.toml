[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziperflow"
version = "0.1.0"
description = "my clone version of wisprflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=11,<19",
    "faster-whisper>=1.1",
    "numpy>=1.24",
    "pyperclip>=1.9",
    "sounddevice>=0.5",
]

[project.scripts]
ziperflow = "ziperflow:main"

[tool.setuptools]
py-modules = ["ziperflow"]
